name: Checks
on:
  push:
    branches-ignore:
      - pages-archive
  pull_request:
permissions:
  contents: read
jobs:
  solar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/test-mission-import.py
      - run: npm run check
      - run: npm run validate:solar
      - run: npm run validate:route
      - run: npm run validate:waiting
      - run: npm run validate:sessions
      - run: npm run validate:spike
      - run: npm run validate:mission
      - run: npm run validate:campaign
      - run: npm run validate:westward
      - run: npm run build:web
      - run: npm run test:browser
        env:
          GLOBE_PREVIEW_LOG: '1'
      - name: Проверить вложенный путь Pages
        run: npm run test:browser
        env:
          SPIKE_TEST_BASE: /into-the-night/release/0.1.0/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: globe-previews
          path: .build/previews/*.png
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run fixtures:solar
      - run: git diff --exit-code -- test/fixtures/solar-reference.json
