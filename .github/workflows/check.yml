name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  solar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run validate:solar
      - run: npm run validate:route
      - run: npm run validate:waiting
      - run: npm run validate:sessions
      - run: npm run validate:spike
      - run: npm run build:web
      - run: npm run test:browser
      - run: npm run fixtures:solar
      - run: git diff --exit-code -- test/fixtures/solar-reference.json
